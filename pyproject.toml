[project]
name = "mcp-idea2exp"
version = "0.1.0"
description = "MCP server: turn a Stage-3 research idea (selected hypotheses) into a Stage-5 experiment design (methodology + pre-registered experiment plan + assignments + verified codebase pin)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "openai>=1.40.0",
]

[project.scripts]
mcp-idea2exp = "mcp_idea2exp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_idea2exp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
